<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Сравнение моделей: Человек vs Спектральные Призраки</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0c0f1d; overflow: hidden; font-family: -apple-system, sans-serif; }
    canvas { display: block; }
    #toolbar {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; background: rgba(15, 23, 42, 0.85);
      padding: 8px 12px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(8px); z-index: 100;
    }
    button {
      background: #1e293b; color: #cbd5e1; border: 1px solid #334155;
      padding: 8px 14px; border-radius: 20px; cursor: pointer; font-size: 13px;
      font-weight: 500; transition: all 0.2s ease;
    }
    button:hover { background: #334155; color: #fff; }
    button.active {
      background: #3b82f6; color: #fff; border-color: #60a5fa;
      box-shadow: 0 0 14px rgba(59, 130, 246, 0.5);
    }
    #hint {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      color: #64748b; font-size: 12px; pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="toolbar">
    <button id="btn-human">👤 Человек (Канев в поло)</button>
    <button id="btn-kanev" class="active">👻 Призрак Канева (Синий)</button>
    <button id="btn-korshunov">🍺 Призрак Коршунова (Янтарь)</button>
    <button id="btn-maslennikov">📐 Призрак Масленникова (Фиолет)</button>
  </div>
  <div id="hint">🖱 ЛКМ — вращать | Колесо — зум | ПКМ — панорама</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0c16);
scene.fog = new THREE.Fog(0x0a0c16, 6, 20);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 50);
camera.position.set(0, 1.2, 3.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0);
controls.enableDamping = true;

// Свет
scene.add(new THREE.AmbientLight(0x223355, 1.2));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(3, 4, 3);
scene.add(key);

// Платформа
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(2.2, 36),
  new THREE.MeshStandardMaterial({ color: 0x111625, roughness: 0.85 })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

// ── Построение Спектрального Призрака ──────────────────────────────────────────
function createSpectralGhost(colorHex, coreHex, eyeHex) {
  const g = new THREE.Group();
  
  // Мантия
  const robeMat = new THREE.MeshStandardMaterial({
    color: coreHex,
    emissive: colorHex,
    emissiveIntensity: 0.75,
    transparent: true,
    opacity: 0.78,
    roughness: 0.2
  });
  const robe = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.08, 1.15, 24, 6, true), robeMat);
  robe.position.y = 1.0;
  g.add(robe);

  // Голова
  const headMat = new THREE.MeshStandardMaterial({
    color: coreHex,
    emissive: colorHex,
    emissiveIntensity: 0.9,
    transparent: true,
    opacity: 0.88
  });
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 20, 16), headMat);
  head.position.y = 1.62;
  g.add(head);

  // Глаза
  const eyeMat = new THREE.MeshBasicMaterial({ color: eyeHex });
  const eL = new THREE.Mesh(new THREE.SphereGeometry(0.026, 12, 12), eyeMat);
  eL.position.set(-0.065, 1.64, 0.155);
  const eR = eL.clone();
  eR.position.x = 0.065;
  g.add(eL, eR);

  // Внутренний свет
  const pLight = new THREE.PointLight(colorHex, 2.2, 4);
  pLight.position.set(0, 1.3, 0);
  g.add(pLight);

  // Кольца на полу
  const rings = [];
  for (let i = 0; i < 3; i++) {
    const ringMat = new THREE.MeshBasicMaterial({
      color: colorHex,
      transparent: true,
      opacity: 0.4 - i * 0.1,
      wireframe: true
    });
    const r = new THREE.Mesh(new THREE.TorusGeometry(0.35 + i * 0.12, 0.008, 8, 32), ringMat);
    r.rotation.x = Math.PI / 2;
    r.position.y = 0.4 + i * 0.2;
    g.add(r);
    rings.push(r);
  }

  // Частицы
  const particles = [];
  for (let i = 0; i < 6; i++) {
    const p = new THREE.Mesh(new THREE.OctahedronGeometry(0.035), eyeMat);
    g.add(p);
    particles.push({ mesh: p, angle: (i / 6) * Math.PI * 2, speed: 0.8 + i * 0.2, radius: 0.55 + (i % 2) * 0.12, yBase: 1.1 + (i % 3) * 0.2 });
  }

  return {
    group: g,
    update: (t, delta) => {
      g.position.y = Math.sin(t * 1.5) * 0.09;
      pLight.intensity = 1.8 + Math.sin(t * 3) * 0.5;
      rings.forEach((r, idx) => {
        r.rotation.z = t * (0.4 + idx * 0.2);
      });
      particles.forEach(p => {
        p.angle += delta * p.speed;
        p.mesh.position.x = Math.cos(p.angle) * p.radius;
        p.mesh.position.z = Math.sin(p.angle) * p.radius;
        p.mesh.position.y = p.yBase + Math.sin(t * 2 + p.angle) * 0.08;
      });
    }
  };
}

// Создаем варианты
const ghostKanev = createSpectralGhost(0x38bdf8, 0x0284c7, 0xbae6fd);
const ghostKorshunov = createSpectralGhost(0xfbbf24, 0xd97706, 0xfef08a);
const ghostMaslennikov = createSpectralGhost(0xa855f7, 0x7e22ce, 0xf3e8ff);

// Заглушка человеческой модели
const humanGroup = new THREE.Group();
const humanMat = new THREE.MeshStandardMaterial({ color: 0x1a2744, roughness: 0.8 });
const humanBody = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.16, 0.9, 14), humanMat);
humanBody.position.y = 1.1;
const humanHead = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 14), new THREE.MeshStandardMaterial({ color: 0xf5cba7 }));
humanHead.position.y = 1.62;
humanGroup.add(humanBody, humanHead);

const models = {
  human: { group: humanGroup, update: () => {} },
  kanev: ghostKanev,
  korshunov: ghostKorshunov,
  maslennikov: ghostMaslennikov
};

let currentKey = 'kanev';
scene.add(ghostKanev.group);

function switchModel(key) {
  scene.remove(models[currentKey].group);
  currentKey = key;
  scene.add(models[key].group);

  document.querySelectorAll('#toolbar button').forEach(b => b.classList.remove('active'));
  document.getElementById(`btn-${key}`).classList.add('active');
}

document.getElementById('btn-human').onclick = () => switchModel('human');
document.getElementById('btn-kanev').onclick = () => switchModel('kanev');
document.getElementById('btn-korshunov').onclick = () => switchModel('korshunov');
document.getElementById('btn-maslennikov').onclick = () => switchModel('maslennikov');

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  const t = clock.elapsedTime;

  if (models[currentKey]) {
    models[currentKey].update(t, delta);
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
